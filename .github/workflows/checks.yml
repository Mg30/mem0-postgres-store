name: Checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff and mypy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.7.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.7.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest --junitxml=test-results.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: test-results.xml

  build:
    name: Build distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.7.13"
      - run: uv build --no-sources
      - name: Check wheel import and packaged migrations
        run: |
          uv run --no-project --python 3.12 --with dist/*.whl python -c "from importlib.resources import files; import mem0_postgres_store; assert files('mem0_postgres_store').joinpath('migrations/versions/0001_storage.py').is_file()"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
