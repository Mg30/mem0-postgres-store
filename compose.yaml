services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mem0
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-admin-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - mem0-postgres-data:/var/lib/postgresql/data
      - ./examples/postgres/init.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mem0"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  mem0-postgres-data:
