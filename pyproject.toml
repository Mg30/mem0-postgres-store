[project]
name = "mem0-postgres-store"
version = "0.1.0"
description = "Tenant-isolated PostgreSQL persistence for Mem0 OSS 2.2.1"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "mem0ai==2.2.1",
    "sqlalchemy>=2.0.40,<2.1",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.15,<2",
]

[project.urls]
Repository = "https://github.com/Mg30/mem0-postgres-store"
Issues = "https://github.com/Mg30/mem0-postgres-store/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.11", "mypy>=1.15"]
test = ["pytest>=8.3", "pytest-asyncio>=0.26", "testcontainers[postgres]>=4.15"]

[tool.uv]
default-groups = ["dev", "test"]

[tool.hatch.build.targets.wheel]
packages = ["src/mem0_postgres_store"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/mem0_postgres_store"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mem0.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires Docker and a real PostgreSQL Testcontainer"]
